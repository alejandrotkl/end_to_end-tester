<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playwright Link Tester</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Playwright Link Tester</h1>
    <nav class="nav-links">
      <a href="/" class="nav-link active">Проверка</a>
      <a href="/logs.html" class="nav-link">Логи задач</a>
    </nav>
    <div class="key-row">
      <label for="api-key">API-ключ</label>
      <input type="password" id="api-key" placeholder="X-API-Key" autocomplete="off" />
      <button id="save-key">Сохранить</button>
      <span id="key-status" class="status-text"></span>
    </div>
  </header>

  <main>
    <section id="error-box" class="error-box hidden"></section>

    <section class="card">
      <h2>Проверка ссылок</h2>
      <div id="links-rows" class="link-rows"></div>
      <button type="button" id="links-add" class="secondary small-btn">+ Добавить ссылку</button>
      <div class="actions">
        <label for="links-file" class="file-label">Загрузить из файла</label>
        <input type="file" id="links-file" accept=".txt,.json" />
      </div>

      <div class="actions">
        <button id="manual-run">Проверить один раз</button>
        <label for="schedule-interval">Интервал (мин.)</label>
        <input type="number" id="schedule-interval" min="1" step="1" value="5" />
        <button id="schedule-save">Сохранить расписание</button>
        <button id="schedule-run">Проверить сейчас</button>
        <button id="schedule-stop" class="danger">Остановить</button>
      </div>
      <p><span id="manual-status" class="status-text"></span></p>
      <div id="schedule-status" class="status-box"></div>
    </section>

    <section id="progress-card" class="card progress-card">
      <h2>Сейчас выполняется</h2>
      <p class="hint">
        Задача <span id="progress-job-id">—</span>: проверено <span id="progress-count">0</span> из
        <span id="progress-total">0</span>.
      </p>
      <p class="progress-current-line">
        <strong>Проверяется:</strong> <span id="progress-current" class="link-cell">сейчас ничего не проверяется</span>
      </p>
      <p class="progress-current-line">
        <strong>Начало проверки:</strong> <span id="progress-started">—</span> &nbsp;·&nbsp;
        <strong>Следующая по расписанию:</strong> <span id="progress-next-run">—</span>
      </p>
      <div id="progress-results"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
